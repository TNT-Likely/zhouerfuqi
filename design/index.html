  function confirmDialog() {
    switch (state.modal) {
      case 'avatars':
        if (state.avatarBusy) return;
        state.avatar = state.avatarDraft;
        try {
          localStorage.setItem(AVATAR_STORAGE_KEY, JSON.stringify(state.avatar));
        } catch {
          // The chosen avatar still applies until the preview is closed.
        }
        closeDialog();
        return;
      case 'time': {
        const { hour, minute, label } = state.pendingTime;
        if (state.times.some((time) => time.hour === hour && time.minute === minute)) {
          state.timeError = '这个时间已经在班组里。';
          renderDialog('[role="alert"]');
          return;
        }
        state.times.push({ id: `custom-${hour}-${minute}`, hour, minute, label: label.trim() });
        state.times.sort((a, b) => a.hour * 60 + a.minute - b.hour * 60 - b.minute);
        closeDialog();
        return;
      }
      case 'delete':
        state.primaryDeleted = true;
        state.primaryOn = false;
        state.scene = 'home';
        closeDialog();
        announceFeedback('班组已删除', '此班组后续响铃已取消。', 'check');
        return;
      case 'import':
        Object.assign(state, {
          ...sampleBackup, weekdays: { ...sampleBackup.weekdays },
          customDates: new Set(sampleBackup.customDates), times: sampleBackup.times.map((time) => ({ ...time })),
        });
        closeDialog();
        announceFeedback('样例排班已恢复', '班组和响铃时间已更新。', 'check');
        return;
      case 'trial':
        closeDialog();
        announceFeedback('试响排期预览', '真机将在 30 秒后响铃，可以锁屏观察。', 'alarm');
        return;
      case 'update':
        closeDialog();

        return;
      case 'update-error':
        openDialog('update');
        return;
      case 'import-error':
        openDialog('import');
        return;
      case 'export':
        closeDialog();
        announceFeedback('备份分享预览', '真机会打开系统分享面板。', 'upload');
        return;
      case 'resync':
        closeDialog();
        announceFeedback('响铃已重排', '已同步未来 14 天的样例响铃。', 'check');
        return;
      case 'holidays':
        closeDialog();
        announceFeedback('暂无新年份数据', '预览当前使用 2026 年样例数据。', 'calendar');
        return;
      case 'permissions':
      case 'permissions-missing':
      case 'lock': {
        const opensSettings = state.modal !== 'permissions' || !state.guideSteps[0];
        closeDialog();
        if (opensSettings) announceFeedback('打开系统设置', '真机会进入周而复起的系统设置。', 'settings');
        return;
      }
      default:
        closeDialog();
    }

    for (const [scene, screen] of Object.entries(screens)) {
      const element = $(screen.id);
      const active = scene === state.scene;
      if (active) element.innerHTML = screen.render();
      element.classList.toggle('active', active);
      element.classList.toggle('is-entering', active && previous !== state.scene);
      element.inert = !active || !!state.modal;
      if (active) element.querySelector('.p-scroll')?.scrollTo(0, scrollOffsets[scene] || 0);
    }

    const theme = THEMES[state.themeIdx];
    $('logoArc').setAttribute('stroke', theme.dark);
    $('logoDot').setAttribute('fill', theme.dark);
    renderTokens();
    renderDialog();
  }

  function renderGallery() {
    if (state.viewMode !== 'gallery') return;
    const theme = THEMES[state.themeIdx];
    $('galleryGrid').innerHTML = Object.entries(screens)
      .filter(([id]) => id !== 'guide' || state.platform === 'android')
      .map(([id, screen]) => `
        <div class="zf-gallery-item">
          <div class="zf-phone is-mini ${id === 'ring' ? 'p-phone-ringing' : ''}" data-platform="${state.platform}"
            data-appearance="${state.appearance}" style="--theme-light:${theme.light};--theme-dark:${theme.dark}">
            <div class="p-statusbar">
              <span class="zf-num">09:41</span><div class="p-island"></div>
              <div class="p-status-icons">${ico('wifi')}${ico('battery')}</div>
            </div>
            <div class="p-viewport">
              <div class="p-screen active ${id === 'ring' ? 'p-ring-screen' : ''}" data-screen="${id}">${screen.render()}</div>
            </div>
          </div>
          <div class="zf-gallery-cap">${screen.title}</div>
        </div>`).join('');
  }

  function markControls(id, key, value) {
    $(id).querySelectorAll('button').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset[key] === value));
    });
  }

  function renderAll() {
    $('zfStage').className = `zf-stage mode-${state.viewMode}`;
    $('sceneControlsRow').style.display = state.viewMode === 'single' ? '' : 'none';
    $('sceneSeg').querySelector('[data-scene="guide"]').disabled = state.platform === 'ios';
    const modalSelect = $('modalSelect');
    for (const option of modalSelect.options) option.disabled = state.platform === 'ios' && androidDialogs.has(option.value);
    modalSelect.value = Object.hasOwn(dialogScenes, state.modal) ? state.modal : '';
    markControls('sceneSeg', 'scene', state.scene);
    markControls('viewModeSeg', 'view', state.viewMode);
    markControls('appAppearanceSeg', 'appTheme', state.appearance);
    markControls('platformSeg', 'platformChoice', state.platform);
    initSwatches();
    renderMainPhone();
    renderGallery();
  }

  function initSwatches() {
    $('swatchBar').innerHTML = THEMES.map((theme, i) => `
      <button class="zf-swatch" data-tidx="${i}" style="background:${theme[state.appearance]}" aria-pressed="${i === state.themeIdx}" title="${theme.name}" aria-label="${theme.name}"></button>
    `).join('');
  }

  function navigate(scene, resetScroll = false) {
    $('phoneFeedback').replaceChildren();
    if (scene === 'ring') {
      state.ringReturn = 'home';
      state.ringState = 'ringing';
      state.ringDelay = 0;
    }
    if (scene === 'calendar') state.calReturn = 'home';
    if (scene === 'home' || (scene === 'edit' && resetScroll)) state.draftName = null;
    if (resetScroll) scrollOffsets[scene] = 0;
    state.viewMode = 'single';
    state.modal = null;
    state.scene = scene;
  }

  function togglePreset(id) {
    const preset = PRESETS.find((time) => time.id === id);
    const index = state.times.findIndex((time) => time.hour === preset.hour && time.minute === preset.minute);
    if (index >= 0) {
      state.times.splice(index, 1);
    } else {
      state.times.push({ ...preset });
      state.times.sort((a, b) => a.hour * 60 + a.minute - b.hour * 60 - b.minute);
    }
  }

  function changeMonth(step) {
    if (!step) {
      state.calY = 2026;
      state.calM = 11;
      state.selDate = TODAY;
      return;
    }
    const date = new Date(state.calY, state.calM - 1 + step, 1);
    state.calY = date.getFullYear();
    state.calM = date.getMonth() + 1;
    state.selDate = `${state.calY}-${pad(state.calM)}-01`;
  }

  function editMonth(action) {
    if (action === 'clear-all') {
      state.customDates.clear();
      return;
    }
    const last = new Date(state.calY, state.calM, 0).getDate();
    for (let day = 1; day <= last; day++) {
      const date = `${state.calY}-${pad(state.calM)}-${pad(day)}`;
      if (action === 'clear') state.customDates.delete(date);
      if (action === 'all' || (action === 'workdays' && dow(date) <= 5)) state.customDates.add(date);
    }
  }

  $('zfApp').addEventListener('click', (event) => {
    const btn = event.target.closest('button, [data-goto]');
    if (!btn || btn.disabled) return;
    const data = btn.dataset;

    if (data.modalAct) {
      if (data.modalAct === 'confirm') confirmDialog();
      else if (data.modalAct === 'preview') previewTrialRing();
      else closeDialog();
      return;
    }
    if (data.modal) {
      const from = btn.closest('.p-screen')?.dataset.screen;
      if (from) state.scene = from;
      openDialog(data.modal, btn);
      return;
    }
    if (data.pickHour !== undefined || data.pickMinute !== undefined || data.minuteStep) {
      const time = state.pendingTime;
      const key = data.pickHour !== undefined ? 'pickHour' : data.pickMinute !== undefined ? 'pickMinute' : 'minuteStep';
      if (key === 'pickHour') time.hour = Number(data.pickHour);
      else if (key === 'pickMinute') time.minute = Number(data.pickMinute);
      else {
        const minutesOfDay = mod(time.hour * 60 + time.minute + Number(data.minuteStep), 1440);
        time.hour = Math.floor(minutesOfDay / 60);
        time.minute = minutesOfDay % 60;
      }
      state.timeError = '';
      const attribute = { pickHour: 'pick-hour', pickMinute: 'pick-minute', minuteStep: 'minute-step' }[key];
      renderDialog(`[data-${attribute}="${data[key]}"]`);
      return;
    }
    if (data.avatarPick !== undefined) {
      $('modalOverlay').querySelector('[data-avatar-file]')?.click();
      return;
    }
    if (data.avatarDefault !== undefined) {
      resetAvatarDraft(DEFAULT_AVATAR);
      renderDialog('[data-avatar-default]');
      return;
    }

    if (data.view) {
      state.viewMode = data.view;
      state.modal = null;
    } else if (data.platformChoice) {
      state.platform = data.platformChoice;
      if (state.platform === 'ios' && state.scene === 'guide') state.scene = 'settings';
      if (state.platform === 'ios' && androidDialogs.has(state.modal)) state.modal = null;
    } else if (data.appTheme) {
      state.systemAppearance = data.appTheme;
      state.appMode = 'system';
      state.appearance = data.appTheme;
    } else if (data.appmode) {
      state.appMode = data.appmode;
      state.appearance = data.appmode === 'system' ? state.systemAppearance : data.appmode;
    } else if (data.tidx !== undefined) {
      state.themeIdx = Number(data.tidx);
    } else if (data.scene) {
      navigate(data.scene, true);
    } else if (data.goto) {
      navigate(data.goto);
    } else if (data.saveGroup !== undefined) {
      const name = (state.draftName ?? state.groupName).trim();
      if (!name) {
        const screen = btn.closest('.p-screen');
        screen.querySelector('[data-group-name-error]').hidden = false;
        const field = screen.querySelector('[data-group-name]');
        field.setAttribute('aria-invalid', 'true');
        field.focus();
        return;
      }
      state.groupName = name;
      if (state.primaryDeleted) state.primaryOn = true;
      state.primaryDeleted = false;
      navigate('home');
    } else if (data.editCalendar !== undefined) {
      navigate('calendar');
      state.calMode = 'manual';
      state.calReturn = 'edit';
    } else if (data.toggle) {
      const key = { primary: 'primaryOn', duty: 'dutyOn', holiday: 'holidayOn' }[data.toggle];
      state[key] = !state[key];
    } else if (data.rk) {
      state.ruleKind = data.rk;
    } else if (data.wd) {
      state.weekdays[data.wd] = !state.weekdays[data.wd];
    } else if (data.nstep) {
      state.nWeeks = Math.min(4, Math.max(1, state.nWeeks + Number(data.nstep)));
    } else if (data.ndstep) {
      state.nDays = Math.min(15, Math.max(2, state.nDays + Number(data.ndstep)));
    } else if (data.anchor) {
      state.anchor = data.anchor;
    } else if (data.delTime) {
      if (state.times.length <= 1) {
        btn.closest('.p-field-card').querySelector('[data-last-time-error]').hidden = false;
        return;
      }
      state.times = state.times.filter((time) => time.id !== data.delTime);
    } else if (data.preset) {
      if (state.times.length === 1 && btn.getAttribute('aria-pressed') === 'true') {
        btn.closest('.p-field-card').querySelector('[data-last-time-error]').hidden = false;
        return;
      }
      togglePreset(data.preset);
    } else if (data.calMode) {
      if (data.calMode === 'manual' && state.ruleKind !== 'customDates') state.ruleKind = 'customDates';
      if (data.calMode === 'rule' && state.ruleKind === 'customDates') state.ruleKind = 'everyNWeeks';
      state.calMode = data.calMode;
    } else if (data.calDate) {
      state.selDate = data.calDate;
      if (state.calMode === 'manual') {
        if (state.customDates.has(data.calDate)) state.customDates.delete(data.calDate);
        else state.customDates.add(data.calDate);
      }
    } else if (data.calStep !== undefined) {
      changeMonth(Number(data.calStep));
    } else if (data.quick) {
      editMonth(data.quick);
    } else if (data.ringAct) {
      state.scene = 'ring';
      state.viewMode = 'single';
      if (data.ringAct === 'snooze') state.ringDelay += 9;
      if (data.ringAct === 'reset') state.ringDelay = 0;
      state.ringState = { snooze: 'snoozed', stop: 'stopped', reset: 'ringing' }[data.ringAct];
    } else if (data.gstep !== undefined) {
      state.guideSteps[data.gstep] = !state.guideSteps[data.gstep];
    } else if (data.vendor) {
      state.vendor = data.vendor;
    } else return;

    renderAll();
    if (data.calDate) $('mainPhone').querySelector(`.p-screen.active [data-cal-date="${data.calDate}"]`)?.focus({ preventScroll: true });
  });

  $('zfApp').addEventListener('input', (event) => {
    if (event.target.hasAttribute('data-time-label')) state.pendingTime.label = event.target.value;
    if (event.target.hasAttribute('data-group-name')) {
      state.draftName = event.target.value;
      if (state.draftName.trim()) {
        event.target.closest('.p-field-card').querySelector('[data-group-name-error]').hidden = true;
        event.target.removeAttribute('aria-invalid');
      }
    }
  });

  $('modalSelect').addEventListener('change', (event) => {
    const modal = event.target.value;
    if (Object.hasOwn(dialogScenes, modal) && !(state.platform === 'ios' && androidDialogs.has(modal))) {
      navigate(dialogScenes[modal], true);
      openDialog(modal);
    } else if (state.modal) closeDialog();
  });

  $('modalOverlay').addEventListener('click', (event) => {
    if (event.target === $('modalOverlay')) closeDialog();
  });
  $('modalOverlay').addEventListener('change', (event) => {
    if (event.target.hasAttribute('data-avatar-file') && event.target.files[0]) {
      void readAvatarFile(event.target.files[0]);
    }
  });
  document.addEventListener('keydown', (event) => {
    if (!state.modal) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      closeDialog();
    }
    if (event.key === 'Tab') {
      const dialog = $('modalOverlay').querySelector('.p-dialog');
      const elements = [...dialog.querySelectorAll('button:not(:disabled), input:not([hidden]), a[href]')];
      const target = document.activeElement;
      if (!dialog.contains(target) || target === dialog || target === elements[event.shiftKey ? 0 : elements.length - 1]) {
        event.preventDefault();
        elements[event.shiftKey ? elements.length - 1 : 0]?.focus();
      }
    }
  });

  const query = new URLSearchParams(location.search);
  if (query.get('view') === 'gallery') state.viewMode = 'gallery';
  if (Object.hasOwn(screens, query.get('scene'))) state.scene = query.get('scene');
  if (query.get('appearance') === 'light') state.appearance = state.systemAppearance = 'light';
  if (query.get('platform') === 'ios') state.platform = 'ios';
  if (state.platform === 'ios' && state.scene === 'guide') state.scene = 'settings';
  const themeIndex = Number.parseInt(query.get('color'), 10);
  if (THEMES[themeIndex]) state.themeIdx = themeIndex;
  const initialModal = query.get('modal');
  if (Object.hasOwn(dialogScenes, initialModal) && !(state.platform === 'ios' && androidDialogs.has(initialModal))) {
    navigate(dialogScenes[initialModal], true);
    openDialog(initialModal);
  } else renderAll();
})();
</script>
</body>
</html>
