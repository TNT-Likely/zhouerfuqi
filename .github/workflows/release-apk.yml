name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName(留空则取 app.json 版本)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VN="$TAG"
          else
            VN="${{ inputs.version_name }}"
            if [ -z "$VN" ]; then VN=$(node -p "require('./apps/mobile/app.json').expo.version"); fi
          fi
          VC=$(date +%s)   # 单调递增,2038 年前均小于 versionCode 上限
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version: $VN ($VC)"

      - name: Ensure NDK/CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Build signed release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --console=plain -PappVersionName="${{ steps.ver.outputs.version_name }}" -PappVersionCode="${{ steps.ver.outputs.version_code }}"

      - name: Prepare artifacts
        env:
          VN: ${{ steps.ver.outputs.version_name }}
          VC: ${{ steps.ver.outputs.version_code }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "apps/mobile/android/app/build/outputs/apk/release/app-${ABI}-release.apk" "dist/zhouerfuqi-${VN}-${ABI}.apk"
          done
          cat > dist/update.json <<JSON
          {
            "versionName": "${VN}",
            "versionCode": ${VC},
            "apk": "https://github.com/${REPO}/releases/download/${TAG}/zhouerfuqi-${VN}-arm64-v8a.apk",
            "notes": "${TAG}"
          }
          JSON
          cat dist/update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动 dispatch 无 tag 上下文:显式指定 tag_name(不存在时 softprops 会自动建)
          tag_name: v${{ steps.ver.outputs.version_name }}
          files: |
            dist/zhouerfuqi-${{ steps.ver.outputs.version_name }}-arm64-v8a.apk
            dist/zhouerfuqi-${{ steps.ver.outputs.version_name }}-armeabi-v7a.apk
            dist/zhouerfuqi-${{ steps.ver.outputs.version_name }}-x86_64.apk
            dist/update.json
          body: |
            周而复起 ${{ steps.ver.outputs.version_name }}

            - 真机(华为/小米等)下载 **arm64-v8a** 版安装
            - 已装旧版的用户可在 App 内「设置 → 检查更新」自助升级

      - name: Commit update manifest to main
        run: |
          mkdir -p updates
          cp dist/update.json updates/update.json
          git config user.name "zhouerfuqi-ci"
          git config user.email "ci@zhouerfuqi.local"
          git add updates/update.json
          git commit -m "ci: update manifest ${{ github.ref_name }}" || echo "manifest unchanged"
          # main 可能在构建期间前进(如文档提交):rebase 后再推;全败必须显式红,否则 manifest 丢失无感知
          push_ok=""
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              push_ok=1
              break
            fi
            echo "manifest push attempt $i failed, retry in 15s"
            sleep 15
          done
          if [ -z "$push_ok" ]; then
            echo "::error::manifest write-back to main failed after 5 attempts (release assets are still published)"
            exit 1
          fi
