name: ASC Beta Link
# 查询 TestFlight 构建状态;创建/复用外测组并开启公开链接,输出 join URL
on:
  workflow_dispatch:
    inputs:
      make_public_link:
        description: '创建/更新公开链接(external group + latest build)'
        type: boolean
        default: true

jobs:
  asc:
    runs-on: ubuntu-latest
    env:
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Query TestFlight status & public link
        run: |
          if [ -z "${APPLE_API_KEY_CONTENT:-}" ]; then
            echo "::warning::APPLE_API_KEY_CONTENT 未配置"
            exit 1
          fi
          python3 -m pip install --quiet pyjwt cryptography requests
          # 注意:heredoc 结束标记必须与正文同列(YAML 块标量剥基础缩进,见 release-ios 教训)
          cat > /tmp/asc.py << 'ASC_SCRIPT'
          import jwt, time, os, sys, json, requests

          KEY = os.environ['APPLE_API_KEY_CONTENT']
          KID = os.environ['APPLE_API_KEY_ID']
          ISS = os.environ['APPLE_API_ISSUER_ID']
          BUNDLE = 'com.tntlikely.zhouerfuqi'
          MAKE_LINK = os.environ.get('MAKE_LINK', 'true') == 'true'

          token = jwt.encode(
              {'iss': ISS, 'iat': int(time.time()), 'exp': int(time.time()) + 1200,
               'aud': 'appstoreconnect-v1'},
              KEY, algorithm='ES256', headers={'kid': KID})
          H = {'Authorization': 'Bearer ' + token}
          B = 'https://api.appstoreconnect.apple.com'
          # 2026-11 起 Apple 已退役老域名 api.appstoreconnect.com(NXDOMAIN,CI 与公共 DNS 均验证)

          def req(method, path, **kw):
              r = requests.request(method, B + path, headers=H, timeout=30, **kw)
              if r.status_code >= 400:
                  print(f'!! {method} {path} -> {r.status_code}: {r.text[:400]}')
                  r.raise_for_status()
              # 204 No Content(挂构建成功就是空响应)不解析
              return r.json() if r.text.strip() else {}

          apps = req('GET', f'/v1/apps?filter[bundleId]={BUNDLE}')['data']
          if not apps:
              print('NO_APP: bundle 不存在(应用尚未在 ASC 创建)')
              sys.exit(1)
          app_id = apps[0]['id']
          print(f'APP {app_id} {apps[0]["attributes"]["name"]}')

          builds = req('GET', '/v1/builds?filter[app]=' + app_id +
                       '&limit=5&sort=-uploadedDate'
                       '&fields[builds]=version,uploadedDate,processingState')['data']
          print('--- TestFlight builds (latest 5) ---')
          for bld in builds:
              print('v%s  %s  %s' % (bld['attributes']['version'],
                                     bld['attributes']['uploadedDate'][:10],
                                     bld['attributes']['processingState']))
          ready = [b for b in builds if b['attributes']['processingState'] == 'VALID']
          if not ready:
              print('NO_READY_BUILD')
          build_id = ready[0]['id'] if ready else None

          # Beta App Review 状态:公开链接必须等首个外测构建过审
          if build_id:
              full = req('GET', '/v1/builds/' + build_id +
                         '?fields[builds]=usesNonExemptEncryption,processingState,betaAppReviewSubmission')['data']
              print('BUILD_DETAIL', json.dumps(full['attributes'], ensure_ascii=False))
              locs = req('GET', f'/v1/apps/{app_id}/betaAppLocalizations')['data']
              for l in locs:
                  print('LOC_DETAIL', l['attributes']['locale'],
                        json.dumps(l['attributes'], ensure_ascii=False)[:500])
              sub = req('GET', f'/v1/betaAppReviewSubmissions?filter[build]={build_id}')['data']
              if sub:
                  print('BETA_REVIEW %s (build v%s)' % (
                      sub[0]['attributes']['state'], ready[0]['attributes']['version']))
              else:
                  print('BETA_REVIEW NONE (尚无外测送审记录)')

          groups = req('GET', f'/v1/betaGroups?filter[app]={app_id}')['data']
          ext = [g for g in groups if not g['attributes']['isInternalGroup']]
          for g in groups:
              a = g['attributes']
              print('GROUP %s | %s | internal=%s | publicLink=%s | %s' % (
                  g['id'], a['name'], a['isInternalGroup'],
                  a.get('publicLinkEnabled'), a.get('publicLink') or '-'))

          link = None
          for g in ext:
              if g['attributes'].get('publicLink'):
                  link = g['attributes']['publicLink']

          if MAKE_LINK and build_id:
              if ext:
                  gid = ext[0]['id']
                  print(f'REUSE group {gid}')
              else:
                  g = req('POST', '/v1/betaGroups', json={
                      'data': {'type': 'betaGroups', 'attributes': {
                          'name': '公开内测 Public Beta',
                          'isInternalGroup': False,
                          'publicLinkEnabled': True,
                          'publicLinkLimitEnabled': True,
                          'publicLinkLimit': 10000},
                          'relationships': {'app': {'data': {'id': app_id, 'type': 'apps'}}}}})
                  gid = g['data']['id']
                  print(f'CREATED group {gid}')
              # 开启公开链接(若关闭则打开)
              req('PATCH', f'/v1/betaGroups/{gid}', json={
                  'data': {'type': 'betaGroups', 'id': gid,
                           'attributes': {'publicLinkEnabled': True}}})
              # 挂上最新构建(external 组会自动送 Beta App Review)
              req('POST', f'/v1/betaGroups/{gid}/relationships/builds', json={
                  'data': [{'type': 'builds', 'id': build_id}]})
              # 补加密合规声明(已设过会 409「already set」,忽略即可)
              try:
                  req('PATCH', f'/v1/builds/{build_id}', json={
                      'data': {'type': 'builds', 'id': build_id,
                               'attributes': {'usesNonExemptEncryption': False}}})
                  print('COMPLIANCE set')
              except Exception as e:
                  print('COMPLIANCE skip:', str(e)[:120])
              # 外测送审前置:Beta App 描述(本地化)+ 审核联系人
              desc_en = ('Zhouerfuqi is a local-first shift-scheduling alarm app '
                         'for rotating shifts (big/small week, custom shift calendars). '
                         'No account, no ads, no data collection; all data stays on device. '
                         'Features: schedule rules, holiday auto-skip, backup/export.')
              locs = req('GET', f'/v1/apps/{app_id}/betaAppLocalizations')['data']
              if locs:
                  lid = locs[0]['id']
                  req('PATCH', f'/v1/betaAppLocalizations/{lid}', json={
                      'data': {'type': 'betaAppLocalizations', 'id': lid,
                               'attributes': {'description': desc_en,
                                              'privacyPolicyUrl': 'https://github.com/TNT-Likely/zhouerfuqi/blob/main/docs/privacy.md'}}})
                  print('BETA_DESC updated')
              else:
                  req('POST', '/v1/betaAppLocalizations', json={
                      'data': {'type': 'betaAppLocalizations', 'attributes': {
                          'locale': 'en-US', 'description': desc_en,
                          'privacyPolicyUrl': 'https://github.com/TNT-Likely/zhouerfuqi/blob/main/docs/privacy.md'},
                          'relationships': {'app': {'data': {'id': app_id, 'type': 'apps'}}}}})
                  print('BETA_DESC created')
              # 审核联系人:资源随 app 自动创建,只能 GET+PATCH,不能 CREATE
              try:
                  det = req('GET', f'/v1/betaAppReviewDetails?filter[app]={app_id}')['data']
                  if det:
                      req('PATCH', f'/v1/betaAppReviewDetails/{det[0]["id"]}', json={
                          'data': {'type': 'betaAppReviewDetails', 'id': det[0]['id'],
                                   'attributes': {'contactFirstName': 'Xiao',
                                                  'contactLastName': 'Sun',
                                                  'contactEmail': 'sunxiao53283713@gmail.com',
                                                  'contactPhone': '+8615394288037'}}})
                      print('REVIEW_CONTACT updated')
                  else:
                      print('REVIEW_CONTACT none found')
              except Exception as e:
                  print('REVIEW_CONTACT skip:', str(e)[:150])
              # 送审要求主语言的 betaAppLocalization 必须存在
              infos = req('GET', f'/v1/apps/{app_id}/appInfos?include=appInfoLocalizations')['data']
              prim = None
              try:
                  inc = req('GET', f'/v1/apps/{app_id}/appInfos')['included']
                  prim = next((i['attributes']['locale'] for i in inc
                               if i['type'] == 'appInfoLocalizations'
                               and i['attributes'].get('locale')), None)
              except Exception:
                  pass
              # 兜底:取 appInfoLocalizations 的第一项
              if not prim:
                  try:
                      il = req('GET', f'/v1/appInfos/{infos[0]["id"]}/appInfoLocalizations')['data']
                      prim = il[0]['attributes']['locale'] if il else None
                  except Exception:
                      pass
              print('PRIMARY_LOCALE', prim)
              if prim:
                  locs = req('GET', f'/v1/apps/{app_id}/betaAppLocalizations')['data']
                  have = {l['attributes']['locale'] for l in locs}
                  if prim not in have:
                      req('POST', '/v1/betaAppLocalizations', json={
                          'data': {'type': 'betaAppLocalizations', 'attributes': {
                              'locale': prim, 'description': desc_en,
                              'privacyPolicyUrl': 'https://github.com/TNT-Likely/zhouerfuqi/blob/main/docs/privacy.md'},
                              'relationships': {'app': {'data': {'id': app_id, 'type': 'apps'}}}}})
                      print(f'BETA_DESC created for primary locale {prim}')
              # 显式送 Beta App Review(公开链接必须过审)
              sub = req('POST', '/v1/betaAppReviewSubmissions', json={
                  'data': {'type': 'betaAppReviewSubmissions', 'attributes': {},
                           'relationships': {'build': {'data': {
                               'id': build_id, 'type': 'builds'}}}}})
              print('REVIEW_SUBMITTED %s' %
                    sub.get('data', {}).get('attributes', {}).get('state', '?'))
              g = req('GET', f'/v1/betaGroups/{gid}')['data']['attributes']
              link = g.get('publicLink')
              print('build v%s assigned; Beta App Review 会自动提交(首次 24-48h)' %
                    ready[0]['attributes']['version'])

          print('PUBLIC_LINK=' + (link or 'PENDING(no link yet)'))
          ASC_SCRIPT
          MAKE_LINK="${{ inputs.make_public_link }}" python3 /tmp/asc.py
