name: Release iOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName(留空则取 app.json 版本)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  unsigned-ipa:
    # unsigned 包:开源用户可自行签名;TestFlight 签名上传见 testflight job
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VN="$TAG"
          else
            VN="${{ inputs.version_name }}"
            if [ -z "$VN" ]; then VN=$(node -p "require('./apps/mobile/app.json').expo.version"); fi
          fi
          VC=$(date +%s)   # 与 Android 同策略:单调递增 build 号
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version: $VN ($VC)"

      - name: Xcode / SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      - name: Install pods
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          pod --version || sudo gem install cocoapods
          pod install

      - name: Build unsigned archive
        working-directory: apps/mobile/ios
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.ver.outputs.version_name }}" app/Info.plist
          plutil -replace CFBundleVersion -string "${{ steps.ver.outputs.version_code }}" app/Info.plist
          xcodebuild archive -workspace app.xcworkspace -scheme app -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.version_code }}"

      - name: Package unsigned IPA
        working-directory: apps/mobile/ios/build
        env:
          VN: ${{ steps.ver.outputs.version_name }}
        run: |
          mkdir -p Payload
          cp -R app.xcarchive/Products/Applications/app.app Payload/
          zip -qry "zhouerfuqi-${VN}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "zhouerfuqi-${VN}-unsigned.ipa"

      - name: Attach to GitHub Release (tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/ios/build/zhouerfuqi-*-unsigned.ipa

      - name: Upload workflow artifact (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: zhouerfuqi-unsigned-ipa
          path: apps/mobile/ios/build/zhouerfuqi-*-unsigned.ipa

  testflight:
    # 签名构建并直传 TestFlight(与本地验证过的流程一致)
    # secrets 命名遵循 ~/Documents/apple/README.md 账号级材料惯例
    if: github.ref_type == 'tag'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute version
        id: ver
        run: |
          VN="${GITHUB_REF_NAME#v}"
          VC=$(date +%s)
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "TestFlight build: $VN ($VC)"

      - name: Xcode / SDK info
        run: xcodebuild -version && xcodebuild -showsdks | grep iphoneos || true

      - name: Install pods
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install

      - name: Import signing material into temp keychain
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 -d > /tmp/dist.p12
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" build.keychain
          security unlock-keychain -p "$KC_PASS" build.keychain
          # 归档要 15+ 分钟,禁掉默认 5 分钟自动上锁(否则 codesign errSecInternalComponent)
          security set-keychain-settings -t 54000 build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign
          # WWDR 中间证书(Xcode 自带;账号证书链到 G3/2030 续期版)
          WWDR=$(ls /Applications/Xcode*.app/Contents/SharedFrameworks/DVTFoundation.framework/Versions/A/Resources/AppleWWDRCA-2030.cer 2>/dev/null | head -1)
          if [ -n "$WWDR" ]; then security import "$WWDR" -k build.keychain; else
            security import /Applications/Xcode.app/Contents/SharedFrameworks/DVTFoundation.framework/Versions/A/Resources/AppleWWDRCAG6.cer -k build.keychain; fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" build.keychain >/dev/null
          security list-keychains -d user -s ~/Library/Keychains/build.keychain-db $(security list-keychains -d user | tr -d ' ' | grep -v build.keychain)
          security find-identity -v -p codesigning build.keychain
          echo "SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)" >> "$GITHUB_ENV"
          rm -f /tmp/dist.p12

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          # secret 是 base64(GitHub secret 只收 UTF-8,二进制 profile 必须转存)
          echo "$PROFILE" | base64 -d > /tmp/zf.mobileprovision
          UUID=$(security cms -D -i /tmp/zf.mobileprovision | plutil -extract UUID raw -o - -)
          PROFILE_NAME=$(security cms -D -i /tmp/zf.mobileprovision | plutil -extract Name raw -o - -)
          echo "profile: $PROFILE_NAME ($UUID)"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/zf.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          rm -f /tmp/zf.mobileprovision

      - name: Signed archive
        working-directory: apps/mobile/ios
        # Expo 把版本写死在 Info.plist,必须归档前直接改(CLI build settings 压不过)
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.ver.outputs.version_name }}" app/Info.plist
          plutil -replace CFBundleVersion -string "${{ steps.ver.outputs.version_code }}" app/Info.plist
          xcodebuild archive -workspace app.xcworkspace -scheme app -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/app-signed.xcarchive \
            CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=${{ env.SIGNING_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_NAME }}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.version_code }}"

      - name: Export signed IPA
        working-directory: apps/mobile/ios
        # 注意:这里不能用 heredoc——YAML 块内缩进的结束标记 bash 不认,
        # 会把后续命令吞进 plist 内容(假绿、无产物)
        run: |
          # ITSAppUsesNonExemptEncryption=false:只用系统 HTTPS(标准加密豁免),
          # 不声明会卡「Missing Compliance」挡住 Beta 审核
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>export</string>' \
            '<key>teamID</key><string>JS3KDL8437</string>' \
            '<key>signingStyle</key><string>manual</string>' \
            "<key>signingCertificate</key><string>$SIGNING_IDENTITY</string>" \
            "<key>provisioningProfiles</key><dict><key>com.tntlikely.zhouerfuqi</key><string>$PROFILE_NAME</string></dict>" \
            '<key>uploadSymbols</key><true/>' \
            '<key>ITSAppUsesNonExemptEncryption</key><false/>' \
            '</dict></plist>' > /tmp/export.plist
          xcodebuild -exportArchive -archivePath build/app-signed.xcarchive \
            -exportOptionsPlist /tmp/export.plist -exportPath build

      - name: Upload to TestFlight (altool)
        working-directory: apps/mobile/ios
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app -f build/app.ipa -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
