plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.zfalarm'
version = '0.1.0'

android {
  namespace 'expo.modules.zfalarm'
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // HeadlessJsTaskService 等 RN 类:由 react-native-gradle-plugin 替换为本地 ReactAndroid
  compileOnly "com.facebook.react:react-native:+"
}
